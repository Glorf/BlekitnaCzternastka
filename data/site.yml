# Treść strony Błękitnej XIV. Tu edytujemy dane co kilka miesięcy.
# Teksty o szczepie i drużynach oraz kontakty pochodzą ze starej strony.
# Obozy (terminy, miejsca, ceny) są jeszcze do uzupełnienia.

szczep:
  nazwa: Błękitna Czternastka
  hasla: "Harcerze z Poznania. Od 1919 roku."
  opis: >-
    Błękitna XIV to szczep harcerski z Poznania: drużyny dla zuchów, harcerek
    i harcerzy w każdym wieku oraz krąg instruktorski Kłuszyn. Poniżej każda
    z drużyn z kontaktem do drużynowego.
  adres: ul. Bukowska 16, 60-809 Poznań
  email: blekitna14@gmail.com
  szczepowy:
    imie: ""
    telefon: +48 536 583 778
    email: blekitna14@gmail.com
  # Tekst "Kim jesteśmy?" ze starej strony.
  # Skrócony tekst "Kim jesteśmy?" (pełny jest na starej stronie).
  kim:
    - Jesteśmy dziećmi i młodymi dorosłymi, uczniami i studentami. Różni nas wiele, ale jedno nas łączy – jesteśmy harcerzami i możemy liczyć na siebie nawzajem. Raz do roku znikamy na miesiąc gdzieś w lesie, gdzie budujemy od podstaw własny, mały świat.
    - Poznać nas może każdy, bez żadnych zobowiązań ani przysiąg. Weź tylko szczoteczkę do zębów i paczkę ciastek.

linki:
  facebook: https://facebook.com/blekitna14/
  instagram: https://instagram.com/blekitna14
  flickr: https://www.flickr.com/photos/blekitna14/albums
  facebook_strona: https://www.facebook.com/Blekitna14/

# Przekaż 1,5% (dane ze starej strony).
procent:
  kwota: 1,5%
  krs: "0000266321"
  cel: "Hufiec „7”, Szczep Błękitna Czternastka"

# Kolumny ścieżki wieku (0 = najmłodsi).
grupy:
  - Zuchy · 6–9
  - 10–13 lat
  - Gimnazjum
  - Liceum

# kol: kolumna, wiersz: pozycja w pionie (dziewczyny wyżej, chłopcy niżej).
druzyny:
  - id: lesne-skrzaty
    nazwa: Leśne Skrzaty
    pelna: Gromada zuchowa „Leśne Skrzaty”
    opis: zuchy, 6–9 lat
    zdjecie: li.jpg
    kol: 0
    wiersz: 0.5
    tekst:
      - Gromada zuchowa „Leśne Skrzaty” to miejsce, gdzie najmłodsi – dzieci w wieku 6–9 lat – odkrywają świat poprzez zabawę i rozwijanie nowych umiejętności. Podczas zbiórek budujemy statki kosmiczne, rozwiązujemy zagadki, pomagamy szalonym naukowcom, poznajemy pląsy, przy okazji zdobywając coraz to nowe sprawności. Oprócz cotygodniowych piątkowych zbiórek, wybieramy się czasem w weekendy na biwaki z naszym szczepem oraz rajdy zuchowe z zaprzyjaźnionymi gromadami.
      - Każde nasze spotkanie to nowa przygoda i mnóstwo radości!
    zbiorka: piątki
    druzynowy: {imie: Dominika Sagalara, kobieta: true, telefon: 784 261 648, email: dominika.sagalara@zhp.net.pl}
  - id: lesna
    nazwa: Leśna
    pelna: Drużyna Harcerska „Leśna”
    opis: dziewczyny, 10–13 lat
    zdjecie: lesna.jpg
    kol: 1
    wiersz: 0
    tekst:
      - „Leśna” to wyjątkowa drużyna dla dziewczynek w wieku 10–13 lat. Jesteśmy oryginalne i pomysłowe, dlatego za każdym razem na naszych zbiórkach świetnie się bawimy, poznając różne zakątki świata, dowiadując się czegoś o naszym ciele lub zgłębiając tajniki handlu – zawsze znajdzie się coś ciekawego do odkrycia. Czasami jesteśmy komandosami i mamy bardzo trudne zadania do wykonania, podczas których uczymy się samodzielności i współpracy, ale czasami zasługujemy też na chwilę odpoczynku i jesteśmy księżniczkami. Lubimy porysować, ugotować coś smacznego, poplotkować.
      - Naszą patronką jest Maria „Majka” Krassowska, sanitariuszka z czasów powstania warszawskiego, dlatego jeździmy na rajdy do Warszawy, aby móc dowiedzieć się o niej, odwiedzając Muzeum Powstania Warszawskiego, jej rodzinny dom czy grób na Powązkach. Oczywiście to nie wszystko – czasami lubimy po prostu wyjechać na weekend nad jezioro. Zapraszamy na zbiórki wszystkie dziewczynki, które chciałyby przeżyć wspaniałą przygodę, spróbować nowych rzeczy i nie boją się wyzwań.
    druzynowy: {imie: Alicja Han, kobieta: true, telefon: 724 794 671, email: alicja.han@zhp.net.pl}
  - id: kohorta
    nazwa: Kohorta
    pelna: Drużyna Męska „Kohorta”
    opis: chłopcy, 10–13 lat
    zdjecie: kohorta.jpg
    kol: 1
    wiersz: 1
    tekst:
      - Drużyna męska „Kohorta” zrzesza 20 chłopców w wieku 10–13 lat (klasy 4–6 szkoły podstawowej). Razem z nami przeżyć można wspaniałe przygody, nabyć wiele pożytecznych umiejętności, a także zawiązać przyjaźnie na całe życie! Nasze cotygodniowe zbiórki odbywają się najczęściej na terenie największego parku w Poznaniu – Parku Cytadela – lub w Społecznej Szkole Podstawowej nr 4 na osiedlu Oświecenia.
      - W czasie zbiórek członkowie drużyny biorą udział w grach terenowych, poznając tajniki technik harcerskich, takich jak rozpalanie ogniska, szyfry oraz orientacja w terenie, i przy tym świetnie się bawiąc! Oprócz tego tradycją Kohorty są rajdy w góry, w trakcie których członkowie drużyny mają okazję sprawdzić się fizycznie, a także rozwinąć w sobie pasję turystyki górskiej.
      - Kohorta jest zatem miejscem dla wszystkich młodych chłopaków, którzy czas wolny wolą spędzać aktywniej niż siedząc przed ekranem, nie boją się wyzwań oraz chcą spróbować czegoś nowego, co z czasem ze zwykłego hobby może przeobrazić się w styl życia!
    zbiorka: Park Cytadela lub Społeczna SP nr 4 (os. Oświecenia)
    druzynowy: {imie: Marcin Kniat, telefon: 605 099 553, email: marcin.kniat@zhp.net.pl}
  - id: ster
    nazwa: Ster
    pelna: Żeńska Drużyna Starszoharcerska „Ster” im. Kingi Choszcz
    opis: dziewczyny, gimnazjum
    zdjecie: ster.jpg
    kol: 2
    wiersz: 0.5
    tekst:
      - Żeńska Drużyna Starszoharcerska „Ster” im. Kingi Choszcz to drużyna dziewczyn w wieku gimnazjalnym. Powstała w 2007 roku. Sterniczki cechuje pozytywna energia, sympatia oraz pomysłowość. Spotykamy się na zbiórkach w piątki o 16.45 w Marcinku, a także w każdym semestrze jedziemy na rajd drużyny – byłyśmy już m.in. w Gdańsku, Warszawie oraz Toruniu. Razem robimy wiele ciekawych rzeczy oraz dobrze się bawimy. Serdecznie zapraszamy!
    zbiorka: piątki, 16:45, Marcinek
    druzynowy: {imie: Agnieszka Maślińska, kobieta: true, telefon: 668 988 169, email: agnieszka.maslinska@zhp.net.pl}
  - id: formoza
    nazwa: Formoza
    pelna: Drużyna Męska „Formoza” im. Gen. Mariusza Zaruskiego
    opis: chłopcy, gimnazjum
    zdjecie: formoza.jpg
    kol: 2
    wiersz: 1.5
    tekst:
      - Drużyna Męska „Formoza” im. Gen. Mariusza Zaruskiego to najmłodsza z drużyn działających obecnie w naszym szczepie. Jesteśmy drużyną starszoharcerską, co oznacza, że zrzeszamy gimnazjalistów. Naszym żywiołem jest woda, dlatego możecie się po nas spodziewać wypadów nad morze, ataków na łodzie czy nurkowania. Nasz patron związany jest z górami, więc dołączając do nas poznasz najdziksze zakątki naszego kraju.
      - Nazwa „Formoza” pochodzi od Jednostki Wojskowej „Formoza”, dlatego towarzyszą nam ekscytujące nocne akcje, eksplorowanie opuszczonych budynków, poznawanie technik survivalu i ciągły dreszcz emocji. Przede wszystkim jesteśmy gimnazjalistami, poza poważnymi rzeczami liczy się dla nas świetna zabawa. Jesteśmy Formozą, a Ty możesz stać się jednym z nas. Zapraszamy!
    druzynowy: {imie: Marcin Kniat, telefon: 605 099 553, email: marcin.kniat@zhp.net.pl}
  - id: wiez
    nazwa: Więź
    pelna: Drużyna Żeńska „Więź”
    opis: dziewczyny, liceum i studia
    zdjecie: wiez.jpg
    kol: 3
    wiersz: 0
    tekst:
      - Drużyna Żeńska „Więź” to ekipa licealistek i studentek, które razem lubią spędzać aktywnie czas. Chętnie chodzimy po górach, jeździmy na rowerze czy rolkach, próbujemy swoich sił we wspinaczce. W czasie semestru drużyna działa patrolami, czyli zajmujemy się dokładnie tym, na co mamy ochotę na początku semestru. Do tej pory miałyśmy takie patrole jak filmowy, sportowy, fotograficzny, kulinarny, kulturalny. Oprócz tego pomagamy potrzebującym, ostatnio prowadzimy zajęcia dla podopiecznych fundacji św. Jadwigi. W czasie wakacji, oprócz wyjazdów na obóz szczepu, jeździmy w góry na obozy wędrowne.
      - Nasze zbiórki odbywają się zazwyczaj w weekendy, ale czasem zdarzają się wyjątki, jeżeli tego akurat wymaga dany patrol. Zasadniczo raz w miesiącu wyjeżdżamy na rajdy, zarówno szczepu i hufca, jak też samodzielne wyjazdy drużyny, w czasie których zwiedzamy inne miasta, jedziemy w góry lub na dłuższe wycieczki rowerowe.
    zbiorka: zazwyczaj w weekendy
    druzynowy: {imie: Zofia Nawrocka, kobieta: true, telefon: 797 117 882, email: zofia.nawrocka@zhp.net.pl}
  - id: cichociemni
    nazwa: Cichociemni
    pelna: I Drużyna Męska „Cichociemni”
    opis: chłopcy, liceum
    zdjecie: cichociemni.jpg
    kol: 3
    wiersz: 1
    tekst:
      - I Drużyna Męska „Cichociemni” to działająca od ponad trzydziestu lat załoga facetów z liceum, którzy wytrwale pracują i uczą się, by być godnymi imienia swoich Patronów. Jeśli chcesz poznać smak przygody i braterstwa, masz odwagę postawić przed sobą cele i posiadasz siłę, by dążyć do ideałów, to koniecznie do nas dołącz!
    druzynowy: {imie: Jakub Cichy, telefon: 603 396 144, email: jakub.cichy@zhp.net.pl}

# Krąg instruktorski: tylko na stronie Drużyny (nie na ścieżce wieku na Start).
instruktorzy:
  - id: kluszyn
    nazwa: Kłuszyn
    pelna: Krąg instruktorski „Kłuszyn”
    opis: instruktorzy szczepu
    zdjecie: kluszyn.jpg
    tekst:
      - Kłuszyn to instruktorzy, bez których nasz szczep by nie istniał. Nazwa naszego kręgu instruktorskiego wywodzi się z bitwy pod Kłuszynem – największego zwycięstwa hetmana Żółkiewskiego. Razem staramy się sprawić, by w „Błękitnej” znalazło się miejsce dla każdego, by wszystko, co robimy, było interesujące i choć trochę pożyteczne.
      - Nasi instruktorzy są w bardzo różnym wieku, zajmują się różnymi rzeczami, ale łączy ich jedno – pasja do pomagania innym i naprawiania świata.

